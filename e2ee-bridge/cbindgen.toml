# Generates include/murih_e2ee.h from src/ffi.rs. Run from e2ee-bridge/:
#   cbindgen --config cbindgen.toml --lang c --output include/murih_e2ee.h src/ffi.rs
language = "C"
include_guard = "MURIH_E2EE_H"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs. Do not edit by hand. */"
include_version = false
sys_includes = ["stdint.h", "stddef.h"]

[export]
include = ["MurihDevice", "MurihBytes"]

[fn]
# Output strings and byte buffers are documented in src/ffi.rs.
