server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Universal Links / App Links association files.
    #
    # Both platforms require these to be served from the domain root over
    # HTTPS, with a JSON content type, and crucially with NO redirect: a 301
    # or 302 here silently fails verification and the link falls back to the
    # browser. `try_files` serves the file in place, so there is no redirect.
    #
    # Regenerate with `node scripts/generate-association-files.mjs` whenever the
    # signing keystore or Apple team changes, then verify with:
    #   curl -sI https://web.murihspace.com/.well-known/apple-app-site-association
    location = /.well-known/apple-app-site-association {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Legacy root path, still fetched by some older iOS versions.
    location = /apple-app-site-association {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /.well-known/assetlinks.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Content-Security-Policy in REPORT-ONLY mode: violations are reported but nothing is blocked.
    # To enforce after the reports look clean, rename the header to Content-Security-Policy
    # (keep the same value) and reload nginx. Add report-uri <endpoint> to the value once a
    # reporting endpoint exists; no client-logs endpoint exists on the backend yet.
    # Keep this in the HTML location: add_header here replaces server-level add_header
    # directives, and the SPA fallback to index.html is served from this block.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.murihspace.com https://api-staging.murihspace.com https://graph.murihspace.com https://graph-staging.murihspace.com https://ads.murihspace.com https://staging.murihspace.com wss://api.murihspace.com wss://api-staging.murihspace.com wss://livekit.murihspace.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}