<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MurihSpace | Connect safely. Community, Commerce, Payments & Growth." />
    <link rel="preload" href="/logos/member-icon-light.png" as="image" />
    <link rel="preload" href="/logos/member-icon-dark.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>MurihSpace | Connect Safely</title>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F0F2F5;z-index:99999;transition:opacity 0.3s ease;">
        <style>
          @media (prefers-color-scheme: dark) {
            #app-preloader { background: #18191A !important; }
            #app-preloader .preloader-icon-light { display: none !important; }
            #app-preloader .preloader-icon-dark { display: block !important; }
            #app-preloader .preloader-bar-container { background: rgba(255, 255, 255, 0.12) !important; }
          }
          @keyframes murih-preloader-pulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(33, 100, 182, 0.4)); }
          }
          @keyframes murih-preloader-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
          .preloader-icon {
            width: 72px;
            height: 72px;
            object-fit: contain;
            animation: murih-preloader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            will-change: transform, opacity;
          }
          .preloader-bar-container {
            width: 120px;
            height: 3.5px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 9999px;
            margin-top: 20px;
            overflow: hidden;
            position: relative;
          }
          .preloader-bar-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: #2164B6;
            border-radius: 9999px;
            animation: murih-preloader-shimmer 1.4s ease-in-out infinite;
          }
        </style>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <img class="preloader-icon preloader-icon-light" src="/logos/member-icon-light.png" alt="MurihSpace" width="72" height="72" />
          <img class="preloader-icon preloader-icon-dark" src="/logos/member-icon-dark.png" alt="MurihSpace" width="72" height="72" style="display:none;" />
          <div class="preloader-bar-container">
            <div class="preloader-bar-line"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
